<!DOCTYPE html>
<html>

<head>

    <title>Create Account</title>

    <link rel="stylesheet"
          href="/style.css">

</head>

<body>

<div class="box">

    <h1>Create Account</h1>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form action="/register"
          method="post">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <input type="text"
               name="name"
               placeholder="Full Name"
               required>

        <input type="text"
               name="phone"
               placeholder="Phone Number"
               required>

        <input type="email"
               name="email"
               placeholder="Email">

        <input type="text"
               name="city"
               placeholder="City"
               required>

        <select name="bloodGroup"
                required>

            <option value="">
                Select Blood Group
            </option>

            <option>O+</option>
            <option>O-</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>

        </select>

        <button type="submit">
            Register
        </button>

    </form>

    <a href="/login">
        Already have an account? Login
    </a>

</div>

</body>

</html>
