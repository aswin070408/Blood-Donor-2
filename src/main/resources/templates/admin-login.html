<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="/style.css">

</head>

<body>

<div class="box">

    <h1>🔐 Admin Login</h1>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form action="/admin"
          method="post">

        <input type="text"
               name="username"
               placeholder="Admin Username"
               required>

        <input type="password"
               name="password"
               placeholder="Admin Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>

</html>
